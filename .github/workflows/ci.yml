name: Offline reviewed meeting tasks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.9'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -B -m unittest discover -s tests -v
      - name: Offline doctor
        run: python -B workflow_kit.py --json doctor
      - name: Invented reviewed task export
        shell: python
        run: |
          import json
          import subprocess
          import sys
          result = subprocess.run([sys.executable, "-B", "workflow_kit.py", "--json", "demo"], capture_output=True)
          assert result.returncode == 0
          report = json.loads(result.stdout)
          assert report["synthetic"] and report["review"]["summary"] == {"actions": 5, "consistent": 3, "needs_review": 2}
          assert report["export"]["ready"] and report["export"]["accepted"] == 2 and report["export"]["rejected"] == 3
